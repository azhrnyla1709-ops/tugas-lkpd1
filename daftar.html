<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>
</head>
<body>
    <h2>Form Pendaftaran Ekskul RPL</h2>
    
    <tr>
        <td>Nama Lengkap:</td>
        <td><input type="text" name="nama" placeholder="Masukkan nama lengkap" required></td>
    </tr>
    <br><br>

    <tr>
        <td>Tanggal Lahir:</td>
        <td><input type="date" name="tanggal_lahir" required></td>
    </tr>
    <br><br>

    <tr>
        <td>Nomor Telepon:</td>
        <td><input type="number" name="nomor_telepon" required></td>
    </tr>
    <br><br>

    <tr>
        <td></td>
        <td><button type="submit">Daftar</button></td>
    </tr>
    
</body>
</html>
